packages:
  - "apps/*"
  - "packages/*"

# Centralized version management — all shared deps use "catalog:" placeholder
# See https://pnpm.io/catalogs
catalog:
  # React 19
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0

  # TypeScript & node
  typescript: ^5.9.0
  "@types/node": ^24.0.0

  # Zod 4
  zod: ^4.1.12

  # Drizzle 0.45 (SQLite/D1)
  drizzle-orm: ^0.45.1
  drizzle-kit: ^0.31.8

  # TanStack
  "@tanstack/react-query": ^5.90.0
  "@tanstack/react-router": ^1.130.0
  "@tanstack/react-start": ^1.130.0

  # Tailwind v4 (Phase 3)
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  postcss: ^8.5.0
  autoprefixer: ^10.5.0

  # shadcn dependencies (Phase 3)
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^2.5.5
  tw-animate-css: ^1.4.0
  lucide-react: ^0.562.0

  # Radix primitives
  "@radix-ui/react-slot": ^1.2.0
  "@radix-ui/react-dialog": ^1.1.15
  "@radix-ui/react-label": ^2.1.0
  "@radix-ui/react-checkbox": ^1.1.0
  "@radix-ui/react-progress": ^1.1.0
  "@radix-ui/react-tooltip": ^1.2.0
  "@radix-ui/react-alert-dialog": ^1.1.0

  # Hono + ORPC (Phase 4)
  hono: ^4.10.8
  "@orpc/server": ^1.13.13
  "@orpc/client": ^1.13.13
  "@orpc/tanstack-query": ^1.13.13

  # Workers / Cloudflare (Phase 5)
  alchemy: ^0.90.1
  wrangler: ^4.78.0
  "@cloudflare/workers-types": ^4.20260317.1

  # Biome (Phase 1)
  "@biomejs/biome": ^2.3.10

  # Build tools
  tsup: ^8.3.5
  vinxi: ^0.5.0

  # Other commonly shared
  tsx: ^4.19.2
  concurrently: ^10.0.3